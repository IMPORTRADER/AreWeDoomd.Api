# Local development environment.
#   1. Copy .env.example to .env and fill in values.
#   2. docker compose up --build
# The IDE workflow (dotnet run) is unaffected by this file.
services:
  api:
    build:
      context: .
      dockerfile: src/AreWeDoomd.Api/Dockerfile
    depends_on:
      - redis
    ports:
      - "5188:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AreWeDoomdSql: ${AREWEDOOMD_SQL_CONNECTION}
      Jwt__Key: ${JWT_KEY}
      AgentNotifications__SharedSecret: ${AGENT_SHARED_SECRET}
      # Enables the SignalR Redis backplane for horizontal scaling. Fixed
      # internal address of the compose `redis` service below; no .env value
      # needed. Leave unset (locally / single-instance) to run in-memory.
      ConnectionStrings__Redis: redis:6379
      # SMTP is optional for local dev; add Smtp__Host etc. here when needed.
      # Passed raw; Api's Program.cs maps these onto ChatProviders:*:ApiKey,
      # same pattern as the agent-service below.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DECISION_LOG_ROOT: /app/agent-logs/agent-decisions
      AGENT_OPS_LOG_ROOT: /app/agent-logs/agent-ops
    healthcheck:
      # "Is the port accepting connections?" via bash's built-in /dev/tcp —
      # the slim aspnet image ships no curl/wget. Lets agent-service wait for
      # actual readiness instead of just container start.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 2s
      timeout: 2s
      retries: 15
      # The database preflight blocks Kestrel for up to ~5 minutes while an
      # Azure SQL serverless cold start resumes; the grace period must cover
      # that window or agent-service (service_healthy) never starts. A probe
      # that succeeds sooner still marks the container healthy immediately.
      start_period: 6m
    volumes:
      - agent-logs:/app/agent-logs

  agent-service:
    build:
      context: .
      dockerfile: src/AreWeDoomd.AgentService/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      # Container-to-container traffic goes via the compose service name.
      AgentNotifications__HubUrl: http://api:8080/hubs/agent-notifications
      AgentNotifications__ApiBaseUrl: http://api:8080
      AgentNotifications__SharedSecret: ${AGENT_SHARED_SECRET}
      AgentNotifications__ChatProvider: openrouter
      # Passed raw (not ChatProviders__OpenRouter__ApiKey): the AgentService's
      # Program.cs maps OPENROUTER_API_KEY onto ChatProviders:OpenRouter:ApiKey
      # itself, same as GEMINI_API_KEY.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Decision + session logs land on the shared volume (mounted at /app/logs).
      DECISION_LOG_ROOT: /app/logs/agent-decisions
      AGENT_OPS_LOG_ROOT: /app/logs/agent-ops
    volumes:
      - agent-logs:/app/logs

  redis:
    # Provisioned ahead of use; no app config points at it yet.
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  agent-logs:
  redis-data:
